        .hero {

        }

            color: #ff1e3c;

            color: #e6e6e6;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: 0.3s;
            min-width: 180px;
            justify-content: center;
        }

        .social-btn svg {

            color: #000;
            border-color: #ff1e3c;
            box-shadow: 0 0 20px rgba(255, 30, 60, 0.5);

<script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const CONFIG = {
        hexSize: 40,
        hexScale: 0.95,
        lineWidth: 1,
        baseAlphaMin: 0.2,
        baseAlphaMax: 0.3,
        pulseTriggerEvery: 8,
        pulseIntensityMin: 0.5,
        pulseIntensityMax: 0.8,
        pulseSpeedMin: 0.02,
        pulseSpeedMax: 0.05,
        waveTriggerEvery: 240,
        waveRadiusMin: 150,
        waveRadiusMax: 250,
        waveIntensity: 0.7,
        waveDelay: 400,
        mouseRadius: 180,
        mouseStrength: 0.9,
        mouseTriggerThreshold: 0.6,
        mouseFadeSpeed: 1.5,
        glowBlurMax: 20,
        fillOpacity: 0.15,
        strokeRGB: '255, 30, 60',
        fillRGB: '255, 30, 60',
    };

    // ============================================
    // ANIMATION
    // ============================================
    const canvas = document.getElementById('hexCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let hexagons = [];
    let mouseX = -1000;
    let mouseY = -1000;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        buildGrid();
    }

    function buildGrid() {
        hexagons = [];
        const hexW = Math.sqrt(3) * CONFIG.hexSize;
        const hexH = 2 * CONFIG.hexSize;
        const vertStep = hexH * 0.75;
        const cols = Math.ceil(width / hexW) + 2;
        const rows = Math.ceil(height / vertStep) + 2;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const offset = (r % 2 === 0) ? 0 : hexW / 2;
                const x = c * hexW + offset - hexW;
                const y = r * vertStep - CONFIG.hexSize;
                const baseAlpha = CONFIG.baseAlphaMin + Math.random() * (CONFIG.baseAlphaMax - CONFIG.baseAlphaMin);
                hexagons.push({
                    x, y, baseAlpha,
                    pulse: 0,
                    pulseTarget: 0,
                    pulseSpeed: CONFIG.pulseSpeedMin + Math.random() * (CONFIG.pulseSpeedMax - CONFIG.pulseSpeedMin),
                });
            }
        }
    }

    function drawHex(x, y, size) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = (Math.PI / 3) * i - Math.PI / 2;
            const px = x + size * Math.cos(angle);
            const py = y + size * Math.sin(angle);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
    }

    let frame = 0;

    function animate() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        if (frame % CONFIG.pulseTriggerEvery === 0) {
            const idx = Math.floor(Math.random() * hexagons.length);
            const h = hexagons[idx];
            if (h.pulseTarget === 0) {
                h.pulseTarget = CONFIG.pulseIntensityMin + Math.random() * (CONFIG.pulseIntensityMax - CONFIG.pulseIntensityMin);
                h.pulse = 0;
            }
        }

        if (frame % CONFIG.waveTriggerEvery === 0) {
            const cx = Math.random() * width;
            const cy = Math.random() * height;
            const radius = CONFIG.waveRadiusMin + Math.random() * (CONFIG.waveRadiusMax - CONFIG.waveRadiusMin);
            hexagons.forEach(h => {
                const dist = Math.hypot(h.x - cx, h.y - cy);
                if (dist < radius) {
                    const delay = dist / radius;
                    setTimeout(() => {
                        h.pulseTarget = CONFIG.waveIntensity;
                        h.pulse = 0;
                    }, delay * CONFIG.waveDelay);
                }
            });
        }

        for (const h of hexagons) {
            let mouseInfluence = 0;
            const distToMouse = Math.hypot(h.x - mouseX, h.y - mouseY);

            if (distToMouse < CONFIG.mouseRadius) {
                const normalizedDist = 1 - (distToMouse / CONFIG.mouseRadius);
                mouseInfluence = normalizedDist * CONFIG.mouseStrength;
                if (normalizedDist > CONFIG.mouseTriggerThreshold && h.pulseTarget < 0.5) {
                    h.pulseTarget = mouseInfluence;
                    h.pulse = Math.max(h.pulse, mouseInfluence * 0.5);
                }
            }

            if (h.pulseTarget > 0) {
                h.pulse += h.pulseSpeed;
                if (h.pulse >= h.pulseTarget) {
                    h.pulse = h.pulseTarget;
                    if (mouseInfluence === 0) h.pulseTarget = 0;
                }
            } else if (h.pulse > 0) {
                h.pulse -= h.pulseSpeed * CONFIG.mouseFadeSpeed;
                if (h.pulse < 0) h.pulse = 0;
            }

            const intensity = h.baseAlpha + h.pulse * 0.9 + mouseInfluence * 0.5;
            const activeLevel = Math.max(h.pulse, mouseInfluence);

            if (activeLevel > 0.1) {
                ctx.shadowBlur = CONFIG.glowBlurMax * activeLevel;
                ctx.shadowColor = `rgba(${CONFIG.strokeRGB}, ${activeLevel})`;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.lineWidth = CONFIG.lineWidth;
            ctx.strokeStyle = `rgba(${CONFIG.strokeRGB}, ${intensity})`;
            drawHex(h.x, h.y, CONFIG.hexSize * CONFIG.hexScale);
            ctx.stroke();

            if (activeLevel > 0.3) {
                ctx.fillStyle = `rgba(${CONFIG.fillRGB}, ${activeLevel * CONFIG.fillOpacity})`;
                ctx.fill();
            }
        }

        ctx.shadowBlur = 0;
        requestAnimationFrame(animate);
    }

    window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    window.addEventListener('mouseleave', () => {
        mouseX = -1000;
        mouseY = -1000;
    });

    window.addEventListener('resize', resize);
    resize();
    animate();
</script>
